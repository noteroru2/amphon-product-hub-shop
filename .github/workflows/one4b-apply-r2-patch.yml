name: ONE-4B Apply Store Worker Patch

on:
  push:
    paths:
      - 'scripts/apply-one4b-r2-patch.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic ONE-4B checkout patch
        run: node scripts/apply-one4b-r2-patch.mjs
      - name: Install dependencies
        run: npm ci
      - name: Bundle-check Store Worker with Wrangler
        run: npx wrangler deploy --config workers/r2-upload/wrangler.jsonc --dry-run
      - name: Validate diff
        run: git diff --check
      - name: Commit generated Worker patch
        shell: bash
        run: |
          if git diff --quiet -- workers/r2-upload/src/index.ts; then
            echo "Store Worker already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/r2-upload/src/index.ts
          git commit -m "feat(one4): wire System reservation before Shop checkout"
          git push origin HEAD:main
