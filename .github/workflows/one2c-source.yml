name: ONE-2C Enrichment Workflow Source

on:
  push:
    branches: [main]
    paths:
      - 'config/amphon-one2c.json'
      - 'supabase/migrations/20260915133000_one2c_product_hub_enrichment_workflow.sql'
      - 'supabase/migrations/20260915133500_one2c_enrichment_hardening.sql'
      - 'src/components/EnrichmentQueueDock.tsx'
      - 'src/main.tsx'
      - 'src/styles/one2cEnrichment.css'
      - 'src/vite-env.d.ts'
      - '.env.example'
      - 'docs/ONE_2C_PRODUCT_HUB_ENRICHMENT_WORKFLOW.md'
      - 'scripts/verify-one2c.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/one2c-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify ONE-2C source and Hub TypeScript
        run: npm run verify:one2c
