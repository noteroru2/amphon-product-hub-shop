name: Evidence Publisher Draft QA (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/lib/evidencePublisherPolicy.ts'
      - 'src/components/EvidencePublisherPanel.tsx'
      - 'src/components/TradeEvidenceCenter.tsx'
      - 'workers/evidence-publisher/**'
      - 'tests/evidence-publisher.test.mjs'
      - 'supabase/migrations/20261124_evidence_publisher.sql'
      - 'src/vite-env.d.ts'
      - 'package.json'
      - '.github/workflows/evidence-publisher-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Security and policy tests
        run: npm run verify:evidence-publisher
      - name: Hub typecheck
        run: npm run typecheck
      - name: Hub build with existing regression suite
        run: npm run build
      - name: Worker bundle dry run only (NEVER DEPLOY)
        run: npx wrangler deploy --config workers/evidence-publisher/wrangler.jsonc --dry-run
