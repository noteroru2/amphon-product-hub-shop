name: SEO AI Development P0

on:
  pull_request:
    paths:
      - 'supabase/functions/seo-connector/core.ts'
      - 'supabase/functions/seo-connector/index.ts'
      - 'supabase/functions/seo-connector/developmentStatus.ts'
      - 'supabase/functions/seo-connector/sourceChangeGuard.ts'
      - 'supabase/migrations/20261123094500_seo_source_change_requests.sql'
      - 'src/components/SeoPortfolioDashboard.tsx'
      - 'src/components/SeoControlTower.tsx'
      - 'src/components/SeoDevelopmentCenter.tsx'
      - 'src/components/SeoSourceChangeQueue.tsx'
      - 'src/styles/seoDevelopmentCenter.css'
      - 'scripts/verify-seo-portfolio-mcp.mjs'
      - 'tests/seo-connector.test.mjs'
      - 'tests/seo-development-status.test.mjs'
      - 'tests/seo-source-change.test.mjs'
      - 'tests/seo-draft-pr-executor.test.mjs'
      - 'tests/seo-draft-pr-adapters.test.mjs'
      - 'tests/seo-draft-pr-reconcile.test.mjs'
      - 'tests/seo-release-verification.test.mjs'
      - 'supabase/functions/seo-connector/releaseMeasurement.ts'
      - 'src/components/SeoReleaseVerificationPanel.tsx'
      - 'supabase/functions/seo-gsc/index.ts'
      - 'scripts/seo-draft-pr-reconcile.mjs'
      - '.github/workflows/seo-draft-pr-reconcile.yml'
      - 'scripts/seo-draft-pr-executor-core.mjs'
      - 'scripts/seo-draft-pr-executor-adapters.mjs'
      - 'scripts/seo-draft-pr-executor.mjs'
      - 'scripts/seo-draft-pr-target.mjs'
      - '.github/workflows/seo-draft-pr-execute.yml'
      - 'supabase/migrations/20261123103000_seo_source_change_pr_runs.sql'
      - 'tests/fixtures/seo_source_change_postgres_contract.sql'
      - 'package.json'
      - '.github/workflows/seo-ai-development-p0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify MCP authorization and no-mutation contract
        run: npm run verify:seo-portfolio-mcp
      - name: Verify OAuth MCP transport regression tests
        run: node --test tests/seo-connector.test.mjs
      - name: Verify SEO project readiness and source safety gates
        run: npm run verify:seo-development-status
      - name: Verify source proposal data, path and approval security gates
        run: npm run verify:seo-source-change
      - name: Verify owner-gated Draft PR executor and immutable GitHub workflow
        run: npm run verify:seo-draft-pr-executor
      - name: Verify GitHub and Supabase REST adapters with mocked network
        run: npm run verify:seo-draft-pr-adapters
      - name: Verify read-only GitHub reconciliation and owner-receipt recovery
        run: npm run verify:seo-draft-pr-reconcile
      - name: Verify release SHA proof and GSC post-deploy data completeness gates
        run: npm run verify:seo-release-verification
      - name: Type-check HUB
        run: npm run typecheck
      - name: Build HUB with existing regression guards
        run: npm run build

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seo_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seo_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client for isolated migration contract
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Test migrations and OWNER / ADMIN / STAFF / ANON security
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: seo_contract
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/seo_source_change_postgres_contract.sql
