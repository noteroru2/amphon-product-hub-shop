name: ONE-4C Apply Store Coordination

on:
  push:
    branches:
      - one4c-one4d-source-20260917
    paths:
      - 'scripts/apply-one4c-store-coordination.mjs'
      - 'workers/r2-upload/src/one4-stock-coordinator.ts'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic ONE-4C Store Worker patch
        run: node scripts/apply-one4c-store-coordination.mjs
      - name: Install dependencies
        run: npm ci
      - name: Bundle-check Store Worker
        run: npx wrangler deploy --config workers/r2-upload/wrangler.jsonc --dry-run
      - name: Validate diff
        run: git diff --check
      - name: Commit generated Store Worker coordination
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- workers/r2-upload/src/index.ts; then
            echo "Store Worker coordination already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add workers/r2-upload/src/index.ts
          git commit -m "feat(one4): wire durable payment and release coordination"
          git push origin HEAD:${GITHUB_HEAD_REF}
