name: AI Buyer P0 Pricing Coverage

on:
  push:
    branches:
      - feat/ai-buyer-v1-foundation
    paths:
      - 'workers/ai-buyer/data/p0-pricing-coverage-fixtures-v1.json'
      - 'scripts/verify-ai-buyer-p0-pricing-coverage.mjs'
      - '.github/workflows/ai-buyer-p0-pricing-coverage.yml'
      - 'supabase/migrations/20260922130000_ai_buyer_p0_pricing_coverage_v24.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify AI stays paused
        run: |
          grep -q '"AI_BUYER_PAUSED": "true"' workers/ai-buyer/wrangler.jsonc
      - name: Verify P0 pricing coverage
        env:
          SUPABASE_URL: https://mfpdtlxwdbxitgfzdape.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/verify-ai-buyer-p0-pricing-coverage.mjs
