name: Hub + Shop UX Refresh

on:
  pull_request:
    paths:
      - 'src/**'
      - 'shop/**'
      - 'workers/r2-upload/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/seo-connector/**'
      - 'tests/seo-connector.test.mjs'
      - 'scripts/verify-ai-buyer-cost-history.test.mjs'
      - 'scripts/verify-ai-buyer-cost-learning.test.mjs'
      - 'scripts/verify-ai-buyer-structured-specs.test.mjs'
      - 'scripts/verify-ai-buyer-cost-review.test.mjs'
      - 'scripts/verify-ai-buyer-chat-price-control.test.mjs'
      - 'scripts/verify-ai-buyer-notebook-coverage.test.mjs'
      - 'scripts/verify-pricebook-v28.test.mjs'
      - 'scripts/verify-pricebook-v28-csv.test.mjs'
      - 'scripts/verify-auto-publish.mjs'
      - 'scripts/verify-merchant-shopee-foundation.mjs'
      - 'scripts/verify-shopee-auto-publish.mjs'
      - 'scripts/verify-channel-architecture.mjs'
      - 'scripts/verify-shopee-assisted-listing.mjs'
      - 'scripts/verify-shopee-assisted-listing.mjs'
      - 'docs/shopee-integration-discovery.md'
      - 'docs/channel-architecture.md'
      - '.github/workflows/store-worker-deploy.yml'
      - 'scripts/verify-hub-publish-center-ux.mjs'
      - 'scripts/verify-hub-ease.mjs'
      - 'scripts/verify-gsc-action-engine.mjs'
      - 'scripts/verify-seo-ops-phase3.mjs'
      - 'scripts/verify-seo-action-executor.mjs'
      - '.github/workflows/hub-shop-ux.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shop/**'
      - 'workers/r2-upload/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/seo-connector/**'
      - 'tests/seo-connector.test.mjs'
      - 'scripts/verify-auto-publish.mjs'
      - 'scripts/verify-merchant-shopee-foundation.mjs'
      - 'scripts/verify-shopee-auto-publish.mjs'
      - 'scripts/verify-channel-architecture.mjs'
      - 'docs/channel-architecture.md'
      - 'scripts/verify-hub-publish-center-ux.mjs'
      - 'scripts/verify-hub-ease.mjs'
      - '.github/workflows/hub-shop-ux.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Hub dependencies
        run: npm ci

      - name: SEO monitoring state regressions
        run: node --test tests/seo-connector.test.mjs tests/seo-network.test.mjs tests/seo-gsc.test.mjs tests/seo-growth.test.mjs tests/seo-lab.test.mjs

      - name: Save, navigation and inventory regressions
        run: node --test tests/save-navigation.test.mjs tests/inventory-work-queue.test.mjs tests/hub-operations-guardrails.test.mjs tests/warranty-date.test.mjs tests/battery-condition.test.mjs tests/sold-stock.test.mjs

      - name: PriceBook V2.8 independent safety contracts
        run: node --experimental-strip-types --test scripts/verify-pricebook-v28.test.mjs scripts/verify-pricebook-v28-csv.test.mjs

      - name: Verify AI Buyer cost-history parser
        run: node --experimental-strip-types --test scripts/verify-ai-buyer-cost-history.test.mjs

      - name: Verify AI Buyer Cost Learning evidence guards
        run: node --test scripts/verify-ai-buyer-cost-learning.test.mjs

      - name: Verify AI Buyer structured-spec extraction
        run: node --test scripts/verify-ai-buyer-structured-specs.test.mjs

      - name: Verify AI Buyer owner cost review and data provenance
        run: node --test scripts/verify-ai-buyer-cost-review.test.mjs

      - name: Verify Chat Price Control safety and diff contracts
        run: node --test scripts/verify-ai-buyer-chat-price-control.test.mjs

      - name: Verify notebook price coverage and no-guess safety
        run: node --test scripts/verify-ai-buyer-notebook-coverage.test.mjs

      - name: Hub TypeScript
        run: npm run typecheck

      - name: Hub Website-manager + Auto Publish contracts
        run: |
          node scripts/verify-auto-publish.mjs
          node scripts/verify-merchant-shopee-foundation.mjs
          node scripts/verify-shopee-auto-publish.mjs
          node scripts/verify-channel-architecture.mjs
          node scripts/verify-shopee-assisted-listing.mjs
          node scripts/verify-hub-publish-center-ux.mjs
          node scripts/verify-hub-ease.mjs
          node scripts/verify-gsc-action-engine.mjs
          node scripts/verify-seo-ops-phase3.mjs
          node scripts/verify-seo-action-executor.mjs

      - name: Hub complete production build
        run: npm run build

      - name: Install Worker dependencies
        run: npm --prefix workers/r2-upload ci

      - name: Existing Facebook post correction tests
        working-directory: workers/r2-upload
        run: node --test tests/facebook-warranty-repair.test.mjs

      - name: Worker TypeScript
        run: npm --prefix workers/r2-upload run typecheck

      - name: Install Shop dependencies
        run: npm --prefix shop ci

      - name: Shop Cloudflare build parity
        run: npm --prefix shop run build
