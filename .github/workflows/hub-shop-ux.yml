name: Hub + Shop UX Refresh

on:
  pull_request:
    paths:
      - 'src/**'
      - 'shop/**'
      - 'workers/r2-upload/**'
      - 'supabase/migrations/**'
      - 'scripts/verify-auto-publish.mjs'
      - 'scripts/verify-merchant-shopee-foundation.mjs'
      - 'scripts/verify-shopee-auto-publish.mjs'
      - 'scripts/verify-channel-architecture.mjs'
      - 'scripts/verify-shopee-assisted-listing.mjs'
      - 'scripts/verify-shopee-assisted-listing.mjs'
      - 'docs/shopee-integration-discovery.md'
      - 'docs/channel-architecture.md'
      - '.github/workflows/store-worker-deploy.yml'
      - 'scripts/verify-hub-publish-center-ux.mjs'
      - 'scripts/verify-hub-ease.mjs'
      - 'scripts/verify-gsc-action-engine.mjs'
      - 'scripts/verify-seo-ops-phase3.mjs'
      - '.github/workflows/hub-shop-ux.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shop/**'
      - 'workers/r2-upload/**'
      - 'supabase/migrations/**'
      - 'scripts/verify-auto-publish.mjs'
      - 'scripts/verify-merchant-shopee-foundation.mjs'
      - 'scripts/verify-shopee-auto-publish.mjs'
      - 'scripts/verify-channel-architecture.mjs'
      - 'docs/channel-architecture.md'
      - 'scripts/verify-hub-publish-center-ux.mjs'
      - 'scripts/verify-hub-ease.mjs'
      - '.github/workflows/hub-shop-ux.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Hub dependencies
        run: npm ci

      - name: Hub TypeScript
        run: npm run typecheck

      - name: Hub Website-manager + Auto Publish contracts
        run: |
          node scripts/verify-auto-publish.mjs
          node scripts/verify-merchant-shopee-foundation.mjs
          node scripts/verify-shopee-auto-publish.mjs
          node scripts/verify-channel-architecture.mjs
          node scripts/verify-shopee-assisted-listing.mjs
          node scripts/verify-hub-publish-center-ux.mjs
          node scripts/verify-hub-ease.mjs
          node scripts/verify-gsc-action-engine.mjs
          node scripts/verify-seo-ops-phase3.mjs

      - name: Hub Vite build
        run: npx vite build

      - name: Install Worker dependencies
        run: npm --prefix workers/r2-upload ci

      - name: Worker TypeScript
        run: npm --prefix workers/r2-upload run typecheck

      - name: Install Shop dependencies
        run: npm --prefix shop ci

      - name: Shop Cloudflare build parity
        run: npm --prefix shop run build
