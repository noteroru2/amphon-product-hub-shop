name: AI Buyer Retry Pricing Fixed Cases

on:
  push:
    branches:
      - feat/ai-buyer-v1-foundation
    paths:
      - '.github/workflows/ai-buyer-reprocess-fix-cases-v2.yml'

permissions:
  contents: read

jobs:
  reprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry pricing for fixed cases
        env:
          AI_BUYER_ADMIN_TOKEN: ${{ secrets.AI_BUYER_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AI_BUYER_ADMIN_TOKEN"
          for case_id in 6ed54ba9-b84f-49c2-8cb9-15dd16141aef fc75ebe4-4a91-4614-9dda-f28ab18914bd; do
            payload="$(printf '{"caseId":"%s"}' "$case_id")"
            body_file="$(mktemp)"
            status="$(curl -sS -o "$body_file" -w '%{http_code}'               -X POST 'https://amphon-ai-buyer.noteroru2.workers.dev/v1/admin/case/retry-pricing'               -H "x-ai-buyer-admin-token: $AI_BUYER_ADMIN_TOKEN"               -H 'content-type: application/json'               --data-binary "$payload")"
            cat "$body_file"
            echo
            test "$status" = "200"
            grep -q '"ok":true' "$body_file"
          done
