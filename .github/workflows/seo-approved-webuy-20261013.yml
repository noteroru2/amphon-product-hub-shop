name: Publish approved WEBUY SEO draft
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seo-approved-webuy-20261013.yml']
permissions:
  contents: read
concurrency:
  group: webuy-approved-seo-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: noteroru2/webuy
          ref: 27ce9777aed030959e229a15b56413b975a32ffb
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy reviewed WEBUY commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "27ce9777aed030959e229a15b56413b975a32ffb"
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));if(c.name!=="webuy")process.exit(1)'
          npx wrangler deploy --config wrangler.jsonc
      - name: Verify approved text on production
        run: |
          python - <<'PY'
          import urllib.request,re,html,time
          proof="ผู้ที่ต้องการขายอุปกรณ์ Apple ในอุบลราชธานีสามารถส่งรูป รุ่น ความจุ สภาพ และอุปกรณ์ที่มีทาง LINE @webuy เพื่อให้ทีมงานพิจารณาราคาเบื้องต้นก่อนนัดตรวจ ราคาที่ตกลงหลังตรวจสินค้าจริงอาจต่างจากราคาจากรูป หากรุ่น สภาพ อุปกรณ์ หรืออาการไม่ตรงกับข้อมูลที่แจ้ง"
          url="https://webuy.in.th/services/buy-apple-ubon/"
          for attempt in range(12):
              try:
                  response=urllib.request.urlopen(url,timeout=20)
                  body=response.read().decode()
                  text=' '.join(html.unescape(re.sub('<[^>]+>',' ',body)).split())
                  if response.status==200 and proof in text and body.count('<h1')==1:
                      print("Approved WEBUY content verified on production")
                      break
              except Exception: pass
              time.sleep(5)
          else: raise SystemExit("Approved excerpt is not live; do not start Experiments")
          PY
