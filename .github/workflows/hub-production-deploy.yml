name: Hub Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - '.github/workflows/hub-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://mfpdtlxwdbxitgfzdape.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TWyHir8t7-LO7PZLHAzR6Q_yXjDRK5-
      VITE_R2_UPLOAD_API: https://amphon-product-images.noteroru2.workers.dev
      VITE_ALLOW_SIGNUP: 'false'
      VITE_PUBLIC_APP_URL: https://hub.amphon.co.th
      VITE_SALES_SITE_URL: https://shop.amphon.co.th
      VITE_FACEBOOK_MARKETPLACE_URL: https://www.facebook.com/marketplace/
      VITE_SHOPEE_SELLER_URL: https://seller.shopee.co.th/
      VITE_ONE2C_ENRICHMENT_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build Hub
        run: npm run build

      - name: Stamp release
        shell: bash
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/release.json

      - name: Require Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Deploy AMPHON Product Hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify live deployment
        shell: bash
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            release="$(curl -fsS --max-time 15 https://hub.amphon.co.th/release.json || true)"
            home="$(curl -fsS --max-time 15 https://hub.amphon.co.th/ || true)"
            if echo "$release" | grep -q "$GITHUB_SHA" && echo "$home" | grep -q "AMPHON Product Hub"; then
              echo "Hub production deploy PASS: $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::hub.amphon.co.th did not expose the expected release SHA"
          exit 1
