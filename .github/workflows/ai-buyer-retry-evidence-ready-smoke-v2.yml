name: AI Buyer Retry Evidence Ready Smoke V2

on:
  push:
    branches:
      - feat/ai-buyer-v1-foundation
    paths:
      - '.github/workflows/ai-buyer-retry-evidence-ready-smoke-v2.yml'

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retry exact-model evidence cases
        env:
          AI_BUYER_ADMIN_TOKEN: ${{ secrets.AI_BUYER_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -u
          failed=0
          for case_id in             254f5381-e4e4-4c9f-b7dd-831bb8285af1             a4ecf322-cf4f-452e-aad1-a9125f289417
          do
            payload="$(printf '{"caseId":"%s"}' "$case_id")"
            body_file="$(mktemp)"
            status="$(curl -sS -o "$body_file" -w '%{http_code}'               -X POST 'https://amphon-ai-buyer.noteroru2.workers.dev/v1/admin/case/retry-pricing'               -H "x-ai-buyer-admin-token: $AI_BUYER_ADMIN_TOKEN"               -H 'content-type: application/json'               --data-binary "$payload")"
            echo "CASE $case_id HTTP $status"
            cat "$body_file"
            echo
            if [ "$status" != "200" ]; then failed=1; fi
          done
          exit "$failed"
