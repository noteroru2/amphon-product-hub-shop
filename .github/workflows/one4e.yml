name: ONE-4E Shop Monitoring Contract

on:
  pull_request:
    paths:
      - 'config/one4e-production-observation.json'
      - 'scripts/inspect-one4e-hub-health.mjs'
      - 'scripts/verify-one4e.mjs'
      - 'docs/ONE_4E_SHOP_MONITORING.md'
      - 'workers/r2-upload/wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/one4e.yml'
  push:
    branches: [main]
    paths:
      - 'config/one4e-production-observation.json'
      - 'scripts/inspect-one4e-hub-health.mjs'
      - 'scripts/verify-one4e.mjs'
      - 'docs/ONE_4E_SHOP_MONITORING.md'
      - 'workers/r2-upload/wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/one4e.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ONE-4E Shop monitoring contract
        run: npm run verify:one4e
