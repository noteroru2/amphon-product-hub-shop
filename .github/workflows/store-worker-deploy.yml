name: Store Worker Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'workers/r2-upload/**'
      - '.github/workflows/store-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/r2-upload/package-lock.json

      - name: Install Store Worker dependencies
        working-directory: workers/r2-upload
        run: npm ci

      - name: Typecheck Store Worker
        working-directory: workers/r2-upload
        run: npm run typecheck

      - name: Require Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Sync optional Shopee direct API secrets
        working-directory: workers/r2-upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
        shell: bash
        run: |
          if [ -n "$SHOPEE_PARTNER_ID" ] && [ -n "$SHOPEE_PARTNER_KEY" ]; then
            printf '%s' "$SHOPEE_PARTNER_ID" | npx wrangler secret put SHOPEE_PARTNER_ID --config wrangler.jsonc
            printf '%s' "$SHOPEE_PARTNER_KEY" | npx wrangler secret put SHOPEE_PARTNER_KEY --config wrangler.jsonc
            echo "Shopee direct API credentials synced"
          else
            echo "Shopee direct API disabled: no Partner credentials configured"
          fi

      - name: Deploy amphon-product-images
        working-directory: workers/r2-upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Production smoke test
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsS https://amphon-product-images.noteroru2.workers.dev/store/settings || true)"
            specs="$(curl -fsS 'https://amphon-product-images.noteroru2.workers.dev/store/spec-pages?effectiveIndexPolicy=INDEX&limit=10' || true)"
            if echo "$body" | grep -q '"autoPublish"' \
              && echo "$specs" | grep -q '"canonicalPath"'; then
              echo "Store Worker production smoke PASS"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Store Worker live settings/spec pages are not ready after deploy"
          exit 1
